services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: pupwatch
      MYSQL_USER: pupwatch
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./apps/api
    env_file:
      - ./apps/api/.env.example
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:3000
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: pupwatch
      DB_USERNAME: pupwatch
      DB_PASSWORD: secret
      SANCTUM_STATEFUL_DOMAINS: localhost,localhost:3000
    command: ["sh", "-c", "php artisan key:generate --force && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"]
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build: ./apps/api
    env_file:
      - ./apps/api/.env.example
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: pupwatch
      DB_USERNAME: pupwatch
      DB_PASSWORD: secret
      QUEUE_CONNECTION: database
    command: ["sh", "-c", "php artisan queue:work --queue=checks,alerts --sleep=1 --tries=1 --timeout=60 --max-time=3600"]
    depends_on:
      mysql:
        condition: service_healthy

  scheduler:
    build: ./apps/api
    env_file:
      - ./apps/api/.env.example
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: pupwatch
      DB_USERNAME: pupwatch
      DB_PASSWORD: secret
    command: ["sh", "-c", "while true; do php artisan schedule:run --verbose --no-interaction || true; sleep 60; done"]
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      API_BASE_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  mysql_data: